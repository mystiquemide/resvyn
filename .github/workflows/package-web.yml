name: Package web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/package-web.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Package clean source for deployment
        uses: actions/upload-artifact@v4
        with:
          name: resvyn-web
          path: |
            web/**
            !web/node_modules/**
            !web/.next/**
            !web/data/**
            !web/.env
            !web/.env.*
            web/.env.example
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
